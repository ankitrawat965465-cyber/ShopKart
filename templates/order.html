```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Place Order | ShopKart</title>
    <style>
        body { font-family: Arial; background: #e9edf2; margin: 0; color: #202b3c; }
        header { background: #131c2e; color: white; padding: 20px; font-size: 25px; }
        main { max-width: 500px; margin: 35px auto; padding: 25px; background: white; border-radius: 12px; }
        img { width: 120px; height: 100px; object-fit: contain; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0 16px; box-sizing: border-box; }
        button { background: #ffad42; border: 0; padding: 13px; width: 100%; cursor: pointer; font-weight: bold; }
        a { display: inline-block; margin-top: 15px; }
        .error { color: #b00020; }
    </style>
</head>
<body>
    <header>ShopKart</header>
    <main>
        <h1>Place Your Order</h1>
        <img src="{{ product.image }}" alt="{{ product.name }}">
        <h3>{{ product.name }}</h3>
        <h2>₹{{ product.price }}</h2>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <label>Full Name</label>
            <input name="name" required>

            <label>Phone Number</label>
            <input name="phone" type="tel" required>

            <label>Delivery Address</label>
            <textarea name="address" required></textarea>

            <button type="submit">Place Order</button>
        </form>

        <a href="/">← Continue Shopping</a>
    </main>
</body>
</html>
